<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal || Tasks</title>
    <link rel="stylesheet" href="../css/tasks.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
</head>
<body>
    <div class="grid">
        <header></header>
        <div class="sidebar"></div>
        <main>
            <h1>Tasks</h1>
            <p>Create a task and publish it to one of your courses.</p>
            <section class="tasks-section">
                <div class="form card">
                    <div class="field">
                        <label for="title">Task name <span>*</span></label>
                        <input type="text" id="title" placeholder="e.g. Binary tree assignment" required>                        
                    </div>
                    <div class="field">
                        <label for="description">Description <span>*</span></label>
                        <textarea id="description" rows="4"  placeholder="What should students do?" required></textarea>                     
                    </div>
                    <div class="field-flex">
                        <div class="field">
                            <label for="dueDate">Deadline <span>*</span></label>
                            <input type="date" id="dueDate" required>                     
                        </div> 
                        <div class="field">
                            <label for="courseId">Publish to course <span>*</span></label>
                            <select name="courseId" id="courseId" required>
                                <!-- <option value="cs99">cs99</option> -->
                                <!-- <option value="dynamics">dynamics</option> -->
                                <!-- <option value="machineLearning">machineLearning</option> -->
                            </select>                     
                        </div>                         
                    </div> 
                    <button id="publish-btn">Publish task</button>

                </div>
                <div class="list card" id="task-cards">

                </div>
            </section>
        </main>
    </div>
    <script src="../js/tasks.js" type="module"></script>
</body>
</html>
