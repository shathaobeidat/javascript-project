<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script type="module" src="layout.js"></script>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="theme.css">   <!-- أول شي -->
<link rel="stylesheet" href="your-page.css">
   <title>EduTrack</title>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">
        <img src="assest.jpeg" alt="EduTrack">
      </span>
      <span class="brand-text">
        <span class="brand-top">EduTrack</span>
      </span>
    </div>

    <nav class="nav" aria-label="Main">
      <a href="#dashboard" class="nav-item">
        <i class="fa-regular fa-chart-bar"></i>
        <span>Dashboard</span>
      </a>
      <a href="#students" class="nav-item active" aria-current="page">
      <i class="fa-solid fa-child-dress"></i>        <span>Students</span>
      </a>
      <a href="#analytics" class="nav-item">
      <i class="fa-solid fa-chart-simple"></i>        <span>Analytics</span>
      </a>
      <a href="#reports" class="nav-item">
      <i class="fa-regular fa-file-lines"></i>        <span>Reports</span>
      </a>
      <a href="#alerts" class="nav-item">
     <i class="fa-solid fa-bell"></i>        <span>Alerts</span>
      </a>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <label class="search">
      <i class="fa-solid fa-magnifying-glass"></i>      
     <input type="search" id="search" placeholder="Search students, courses" aria-label="Search students, courses">
      </label>

      <!-- Theme toggle -->
      <button class="icon-btn" id="theme-btn" aria-label="Switch to dark theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>

      <button class="icon-btn" id="notif-btn" aria-label="Notifications, 3 new">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>
        <span class="badge" id="badge">3</span>
      </button>

      <!-- Avatar menu -->
      <div class="profile-wrap">
        <button class="profile" id="profile-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu">
          <span class="avatar">Dr</span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu" id="profile-menu" role="menu" hidden>
          <button role="menuitem" id="support-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>
            Support
          </button>
          <button role="menuitem" id="logout-btn" class="danger">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
            Logout
          </button>
        </div>
      </div>
    </header>

    <h1 id="page-title">Students</h1>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="layout.js"></script>
</body>
</html>
