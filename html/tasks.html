<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gradify | Assignments  </title>
  <link rel="icon" href="../assets/logo.jpeg">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('gradify:theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/tasks.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar"></aside>
    <div class="app-body">
      <div id="app-header"></div>

      <main class="app-main page">
        <div class="page-head">
          <div>
            <h1 class="page-title">Assignments</h1>
            <p class="page-subtitle">Create a assignment and publish it to one of your courses.</p>
          </div>
        </div>

        <section class="tasks-section">

          <div class="tasks-form card">
            <h2 class="card-title">New assignment</h2>

            <label class="field" for="title">Assignment name <span class="req">*</span>
              <input type="text" id="title" placeholder="e.g. Binary tree assignment" required>
            </label>

            <label class="field" for="description">Description <span class="req">*</span>
              <textarea id="description" rows="4" placeholder="What should students do?" required></textarea>
            </label>

            <div class="form-row">
              <label class="field" for="dueDate">Deadline <span class="req">*</span>
                <input type="date" id="dueDate" required>
              </label>
              <label class="field" for="courseId">Publish to course <span class="req">*</span>
                <select name="courseId" id="courseId" required></select>
              </label>
              <label class="field" for="fileType">Add file
                <input type="file" id="file">
              </label>
            </div>

            <button id="publish-btn" type="button" class="btn btn--primary btn--block">Publish assignment</button>
          </div>

          <div class="tasks-list card">
            <h2 class="card-title">Published assignments</h2>
            <div id="task-cards"></div>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/tasks.js"></script>
</body>
</html>
