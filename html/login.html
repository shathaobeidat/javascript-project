<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Gradify</title>
  <link rel="icon" href="../assets/logo.jpeg">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('gradify:theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">

  <main class="auth-card">

    <div class="auth-brand">
      <img src="../assets/logo.jpeg" alt="">
      <h1>Gradify</h1>
    </div>

    <h2 class="auth-title">Welcome back</h2>

    <form class="auth-form" id="login-form" novalidate>
      
      <label class="field" for="email">Email
        <input type="email" id="email" name="email" placeholder="name@university.edu" autocomplete="email" required>
      </label>
      <label class="field" for="password">Password
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn--primary btn--block" id="Log-in-btn">Sign in</button>
      <p class="auth-msg" id="login-message" role="alert"></p>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
